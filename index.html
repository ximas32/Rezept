<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4502b">
<meta name="description" content="Unser privates Rezeptbuch">
<title>Rezeptbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">🍲</div>
  <div class="boot-text">Rezeptbuch wird geladen …</div>
</div>

<!-- Login -->
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="login-logo">🍲</div>
    <h1>Unser Rezeptbuch</h1>
    <p class="muted" id="login-sub">Melde dich an, um loszulegen.</p>
    <form id="login-form" autocomplete="on">
      <label>E-Mail
        <input type="email" id="login-email" required autocomplete="username" inputmode="email">
      </label>
      <label>Passwort
        <input type="password" id="login-password" required autocomplete="current-password" minlength="6">
      </label>
      <p class="error hidden" id="login-error"></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">Anmelden</button>
      <button class="btn btn-ghost btn-block" type="button" id="login-toggle">Noch kein Konto? Registrieren</button>
      <button class="btn btn-link btn-block" type="button" id="login-reset">Passwort vergessen</button>
    </form>
    <p class="setup-hint hidden" id="setup-hint"></p>
  </div>
</div>

<!-- App -->
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn" id="btn-back" title="Zurück" hidden>‹</button>
    <h1 class="topbar-title" id="topbar-title">Rezepte</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-random" title="Zufallsrezept">🎲</button>
      <button class="icon-btn" id="btn-settings" title="Einstellungen">⚙️</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/rezepte" class="tab" data-tab="rezepte"><span>📖</span>Rezepte</a>
    <a href="#/neu" class="tab" data-tab="neu"><span>➕</span>Erstellen</a>
    <a href="#/import" class="tab" data-tab="import"><span>🤖</span>KI-Import</a>
    <a href="#/einkauf" class="tab" data-tab="einkauf"><span>🛒</span>Einkauf<em id="cart-badge" class="badge hidden">0</em></a>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
